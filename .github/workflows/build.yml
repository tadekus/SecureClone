name: Build SecureClone.app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # Set these repository secrets to get a Developer ID-signed, notarized app:
      #   MACOS_CERTIFICATE_P12   base64 of the "Developer ID Application" .p12
      #   MACOS_CERTIFICATE_PWD   its password
      #   APPLE_ID                your Apple ID e-mail
      #   APPLE_TEAM_ID           10-character team ID
      #   APPLE_APP_PASSWORD      an app-specific password for notarytool
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build app bundle (universal)
        run: |
          chmod +x build-app.sh
          ./build-app.sh --universal

      - name: Notarize and staple
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ZIP=$(ls build/SecureClone-*.zip)
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/SecureClone.app
          rm -f "$ZIP"
          ditto -c -k --keepParent build/SecureClone.app "$ZIP"
          echo "Notarized and stapled."

      - name: Read version
        id: ver
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "zip=$(ls build/SecureClone-*.zip)" >> "$GITHUB_OUTPUT"

      - name: Upload SecureClone.app
        uses: actions/upload-artifact@v4
        with:
          name: SecureClone-${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: build/SecureClone-*.zip
          if-no-files-found: error

      # One GitHub Release per build on main, so the app's update check and
      # the README download link always point at the newest build.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}-build${{ github.run_number }}"
          # Release notes: the top section of CHANGELOG.md
          awk 'BEGIN{p=0} /^## /{ if(p) exit; p=1 } p' CHANGELOG.md > notes.md
          echo "" >> notes.md
          if [ "$HAS_CERT" = "true" ]; then echo "Signed with Developer ID and notarized." >> notes.md;
          else echo "Ad-hoc signed (not notarized): right-click → Open on first launch, or run \`xattr -cr /Applications/SecureClone.app\`." >> notes.md; fi
          gh release create "$TAG" "${{ steps.ver.outputs.zip }}" \
            --title "SecureClone ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file notes.md --latest
