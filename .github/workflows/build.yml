name: Build SecureClone.app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app bundle (universal)
        run: |
          chmod +x build-app.sh
          ./build-app.sh --universal

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Upload SecureClone.app
        uses: actions/upload-artifact@v4
        with:
          name: SecureClone-${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: build/SecureClone-*.zip
          if-no-files-found: error
